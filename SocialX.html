<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SocialX</title>
  <style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f6f7f9;
  color: #171717;
  transition: 0.3s;
}

button,
input,
textarea {
  font: inherit;
}


/* TOP BAR */

.topbar {
  height: 65px;
  background: white;
  border-bottom: 1px solid #ddd;

  display: flex;
  align-items: center;

  padding: 0 5%;
  gap: 20px;

  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  font-size: 25px;
  font-weight: 900;
}

.logo span {
  color: #ff3b81;
}

.search {
  background: #f1f2f4;
  border-radius: 25px;

  padding: 10px 15px;

  display: flex;
  align-items: center;

  width: 300px;
}

.search input {
  border: none;
  outline: none;
  background: transparent;
  width: 100%;
  margin-left: 8px;
}

.topIcon {
  margin-left: auto;

  border: none;
  background: none;

  font-size: 22px;
  cursor: pointer;
}


/* LAYOUT */

.layout {
  max-width: 1200px;

  margin: 25px auto;

  padding: 0 15px;

  display: grid;

  grid-template-columns:
    210px
    1fr
    260px;

  gap: 25px;
}


/* SIDEBAR */

.sidebar {
  background: white;

  border-radius: 15px;

  padding: 12px;

  height: fit-content;

  position: sticky;
  top: 90px;
}

.menu {
  width: 100%;

  border: none;
  background: transparent;

  padding: 14px;

  text-align: left;

  border-radius: 10px;

  cursor: pointer;

  margin-bottom: 4px;
}

.menu:hover,
.menu.active {
  background: #f0f0f3;
  font-weight: bold;
}


/* CARD */

.card {
  background: white;

  border: 1px solid #e5e5e5;

  border-radius: 16px;

  padding: 18px;

  margin-bottom: 18px;
}


/* WELCOME */

.emptyRight {
  text-align: center;
}

.bigLogo {
  width: 65px;
  height: 65px;

  border-radius: 20px;

  background:
    linear-gradient(
      135deg,
      #ff3b81,
      #704cff
    );

  color: white;

  display: grid;
  place-items: center;

  font-size: 35px;
  font-weight: bold;

  margin: auto;
}


/* BUTTONS */

.primary {
  border: none;

  background: #111;
  color: white;

  padding: 12px 18px;

  border-radius: 12px;

  cursor: pointer;

  font-weight: bold;
}

.secondary {
  border: 1px solid #ddd;

  background: white;

  padding: 12px;

  border-radius: 12px;

  cursor: pointer;
}

.full {
  width: 100%;
  margin-top: 10px;
}


/* EMPTY STATES */

.empty {
  text-align: center;
  padding: 60px 20px;
}

.emptyIcon {
  font-size: 50px;
}


/* CREATE */

.createCard {
  display: flex;
  gap: 12px;
  align-items: center;
}

.createInput {
  flex: 1;

  background: #f1f2f4;

  border: none;

  padding: 13px 18px;

  border-radius: 25px;

  cursor: pointer;

  text-align: left;

  color: #777;
}


/* POST */

.post {
  padding: 0;
  overflow: hidden;
}

.postHeader {
  display: flex;

  align-items: center;

  gap: 10px;

  padding: 15px;
}

.avatar {
  width: 45px;
  height: 45px;

  border-radius: 50%;

  background:
    linear-gradient(
      135deg,
      #ff3b81,
      #704cff
    );

  color: white;

  display: grid;
  place-items: center;

  font-weight: bold;
}

.postImage {
  width: 100%;

  max-height: 650px;

  object-fit: cover;

  display: block;
}

.postBody {
  padding: 15px;
}

.actions {
  display: flex;
  gap: 20px;
}

.action {
  border: none;
  background: none;

  font-size: 24px;

  cursor: pointer;
}

.comments {
  border-top: 1px solid #eee;

  margin-top: 12px;

  padding-top: 10px;
}

.commentBox {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.commentBox input {
  flex: 1;

  border: 1px solid #ddd;

  border-radius: 20px;

  padding: 9px 12px;
}


/* PROFILE */

.cover {
  height: 150px;

  background:
    linear-gradient(
      135deg,
      #ff3b81,
      #704cff
    );

  border-radius: 15px 15px 0 0;
}

.profileInfo {
  padding: 20px;
}

.profileAvatar {
  margin-top: -50px;
}


/* MODAL */

.modal {
  position: fixed;

  inset: 0;

  background: rgba(0,0,0,.65);

  display: grid;

  place-items: center;

  z-index: 100;
}

.hidden {
  display: none;
}

.modalBox {
  background: white;

  width: min(450px, 92%);

  padding: 25px;

  border-radius: 18px;

  position: relative;
}

.modalBox input,
.modalBox textarea {
  width: 100%;

  padding: 12px;

  margin: 8px 0;

  border: 1px solid #ddd;

  border-radius: 10px;
}

.modalBox textarea {
  min-height: 120px;

  resize: vertical;
}

.close {
  position: absolute;

  right: 15px;
  top: 8px;

  border: none;

  background: none;

  font-size: 30px;

  cursor: pointer;
}


/* DARK MODE */

.dark {
  background: #111;
  color: white;
}

.dark .topbar,
.dark .sidebar,
.dark .card,
.dark .modalBox {
  background: #1c1c1c;
  color: white;

  border-color: #333;
}

.dark .search {
  background: #292929;
}

.dark .search input {
  color: white;
}

.dark .menu:hover,
.dark .menu.active {
  background: #292929;
}

.dark .secondary {
  background: #222;
  color: white;
}


/* MOBILE */

@media(max-width:950px) {

  .layout {
    grid-template-columns:
      70px
      1fr;
  }

  .right {
    display: none;
  }

  .menu {
    text-align: center;
    font-size: 0;
  }

  .menu::first-letter {
    font-size: 20px;
  }

}

@media(max-width:650px) {

  .topbar {
    padding: 0 12px;
  }

  .search {
    width: 160px;
  }

  .layout {
    display: block;
    margin-top: 10px;
  }

  .sidebar {
    position: static;

    display: flex;

    overflow-x: auto;
  }

  .menu {
    min-width: 55px;
  }

}
  </style>
</head>
<body>

<body>

<header class="topbar">

    >

</div>


<!-- CREATE POST -->

<div id="postModal" class="modal hidden">

  <div class="modalBox">

    <button
      class="close"
      onclick="closePost()"
    >
      ×
    </button>

    <h2>➕ Create Post</h2>

    <input
    id="postFile"
    type="file"
    accept="image/*,video/*"
    class="primary full"
>
    📸 Select Photo / Video
</label>

<input
    id="postFile"
    type="file"
    accept="image/*,video/*"
    style="display:none;"
>

    <textarea
      id="postText"
      placeholder="What's on your mind? Use Ideas To Gain Aura💀 ✨"
    ></textarea>

    <input
      id="location"
      type="text"
      placeholder="🌏 Add location"
    >

    <input
      id="hashtags"
      type="text"
      placeholder="# Hashtags"
    >

  <script>
/* =========================
   SOCIAL X
   Firebase Connected
========================= */

let currentPage = "home";

const content = document.getElementById("content");
const loginModal = document.getElementById("loginModal");
const postModal = document.getElementById("postModal");


/* =========================
   HOME
========================= */

function showHome() {

    const user = firebase.auth().currentUser;

    if (user) {

        content.innerHTML = `

            <div class="card">

                <div class="createCard">

                    <div class="avatar">
                        👤
                    </div>

                    <button
                        class="createInput"
                        onclick="openPost()">

                        ✨ Create your first post...

                    </button>

                </div>

            </div>

            <div class="card empty">

                <div class="emptyIcon">
                    🎬
                </div>

                <h2>
                    No Posts Yet 😏
                </h2>

                <p>
                    Create your first post and share it with Social X.
                </p>

                <button
                    class="primary"
                    onclick="openPost()">

                    ➕ Create Post

                </button>

            </div>

        `;

    } else {

        content.innerHTML = `

            <div class="card">

                <div class="createCard">

                    <div class="avatar">
                        ?
                    </div>

                    <button
                        class="createInput"
                        onclick="openLogin()">

                        🔐 Login to create a post...

                    </button>

                </div>

            </div>

            <div class="card empty">

                <div class="emptyIcon">
                    🎬
                </div>

                <h2>
                    No Posts Yet 😏
                </h2>

                <p>
                    Login to create your first post.
                </p>

                <button
                    class="primary"
                    onclick="openLogin()">

                    ✨ Login / Sign Up

                </button>

            </div>

        `;
    }
}
/* =========================
   EXPLORE
========================= */

function showExplore() {

    content.innerHTML = `
        <div class="card">

            <h2>🔎 Explore</h2>

            <p>
                Create Account Not Imagination.
            </p>

        </div>

        <div class="card empty">

            <div class="emptyIcon">
                🌎
            </div>

            <h2>
                Explore Real Social X Content
            </h2>

            <p>
                Real posts and reels will appear here.
            </p>

        </div>
    `;
}


/* =========================
   CREATE
========================= */

function showCreate() {
    openPost();
}


/* =========================
   NOTIFICATIONS
========================= */

function showNotifications() {

    content.innerHTML = `
        <div class="card empty">

            <div class="emptyIcon">
                🔔
            </div>

            <h2>
                No notifications
            </h2>

            <p>
                Your notifications will appear here.
            </p>

        </div>
    `;
}


/* =========================
   MESSAGES
========================= */

function showMessages() {

    content.innerHTML = `
        <div class="card empty">

            <div class="emptyIcon">
                💬
            </div>

            <h2>
                No messages
            </h2>

            <p>
                Your messages will appear here.
            </p>

        </div>
    `;
}


/* =========================
   PROFILE
========================= */

function showProfile() {

    const user = firebase.auth().currentUser;

    if (user) {

        content.innerHTML = `

            <div class="card">

                <div class="cover"></div>

                <div class="profileInfo">

                    <div class="avatar profileAvatar">
                        👤
                    </div>

                    <h2>
                        Your Profile
                    </h2>

                    <p>
                        ${user.email}
                    </p>

                    <button
                        class="secondary"
                        onclick="logout()">

                        🚪 Logout

                    </button>

                </div>

            </div>

            <div class="card empty">

                <div class="emptyIcon">
                    📸
                </div>

                <h3>
                    Your posts will appear here
                </h3>

            </div>
        `;

    } else {

        content.innerHTML = `

            <div class="card">

                <div class="cover"></div>

                <div class="profileInfo">

                    <div class="avatar profileAvatar">
                        ?
                    </div>

                    <h2>
                        Your Profile
                    </h2>

                    <p>
                        Please login or create an account.
                    </p>

                    <button
                        class="primary"
                        onclick="openLogin()">

                        🔐 Login / Sign Up

                    </button>

                </div>

            </div>
        `;
    }
}


/* =========================
   SETTINGS
========================= */

function showSettings() {

    content.innerHTML = `

        <div class="card">

            <h2>⚙️ Settings</h2>

            <hr>

            <h3>👤 Account</h3>

            <p>Profile information</p>

            <p>🔑 Password & Security</p>

            <p>📧 Email</p>

            <hr>

            <h3>🔒 Privacy</h3>

            <p>Private Account</p>

            <p>🚫 Blocked Accounts</p>

            <p>🛡️ Security</p>

            <hr>

            <h3>🔔 Notifications</h3>

            <p>Likes</p>

            <p>Comments</p>

            <p>Followers</p>

            <hr>

            <h3>🎨 Appearance</h3>

            <button
                class="secondary"
                onclick="toggleDarkMode()">

                🌙 Toggle Dark Mode

            </button>

            <hr>

            <h3>ℹ️ About</h3>

            <p>Social X</p>

            <p>Version 1.0</p>

        </div>
    `;
}


/* =========================
   PAGE ROUTER
========================= */

function render() {

    if (currentPage === "home") {
        showHome();
    }

    else if (currentPage === "explore") {
        showExplore();
    }

    else if (currentPage === "create") {
        showCreate();
    }

    else if (currentPage === "notifications") {
        showNotifications();
    }

    else if (currentPage === "messages") {
        showMessages();
    }

    else if (currentPage === "profile") {
        showProfile();
    }

    else if (currentPage === "settings") {
        showSettings();
    }
}


/* =========================
   NAVIGATION
========================= */

document
    .querySelectorAll(".menu")
    .forEach(button => {

        button.addEventListener(
            "click",
            function () {

                currentPage = this.dataset.page;

                document
                    .querySelectorAll(".menu")
                    .forEach(item => {

                        item.classList.remove("active");

                    });

                this.classList.add("active");

                render();

            }
        );

    });


/* =========================
   LOGIN MODAL
========================= */

function openLogin() {

    loginModal.classList.remove("hidden");

}


function closeLogin() {

    loginModal.classList.add("hidden");

}


/* =========================
   FIREBASE SIGN UP
========================= */

function signup() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    if (!email || !password) {

        alert("Please enter email and password.");

        return;
    }

    if (password.length < 6) {

        alert("Password must be at least 6 characters.");

        return;
    }

    firebase.auth()
        .createUserWithEmailAndPassword(
            email,
            password
        )
        .then(function(userCredential) {

            alert("Account created successfully! 🎉");

            closeLogin();

            render();

        })
        .catch(function(error) {

            console.error(error);

            alert(error.message);

        });
}


/* =========================
   FIREBASE LOGIN
========================= */

function login() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    if (!email || !password) {

        alert("Please enter email and password.");

        return;
    }

    firebase.auth()
        .signInWithEmailAndPassword(
            email,
            password
        )
        .then(function(userCredential) {

            alert("Login successful! 🎉");

            closeLogin();

            render();

        })
        .catch(function(error) {

            console.error(error);

            alert(error.message);

        });
}


/* =========================
   LOGOUT
========================= */

function logout() {

    firebase.auth()
        .signOut()
        .then(function() {

            alert("Logged out successfully.");

            render();

        })
        .catch(function(error) {

            console.error(error);

            alert(error.message);

        });
}


/* =========================
   FIREBASE AUTH STATE
========================= */

firebase.auth().onAuthStateChanged(
    function(user) {

        if (user) {

            console.log(
                "Logged in:",
                user.email
            );

        } else {

            console.log(
                "No user logged in."
            );

        }

        render();

    }
);


/* =========================
   CREATE POST
========================= */

function openPost() {

    postModal.classList.remove("hidden");

}


function closePost() {

    postModal.classList.add("hidden");

}


function createPost() {

    const user = firebase.auth().currentUser;

    if (!user) {
        alert("Please login first.");
        openLogin();
        return;
    }

    const fileInput =
        document.getElementById("postFile");

    const text =
        document.getElementById("postText").value.trim();

    const location =
        document.getElementById("location").value.trim();

    const hashtags =
        document.getElementById("hashtags").value.trim();

    const file = fileInput.files[0];

    if (!file) {
        alert("Please select an image or video.");
        return;
    }

    const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp",
        "video/mp4",
        "video/webm"
    ];

    if (!allowedTypes.includes(file.type)) {
        alert("Please select a valid image or video.");
        return;
    }

    const maxSize = 50 * 1024 * 1024;

    if (file.size > maxSize) {
        alert("File must be smaller than 50 MB.");
        return;
    }

    const button =
        document.querySelector(
            '#postModal button[onclick="createPost()"]'
        );

    if (button) {
        button.disabled = true;
        button.innerText = "⏳ Uploading...";
    }

    const fileName =
        Date.now() + "_" + file.name;

    const storageRef =
        firebase.storage()
            .ref()
            .child("posts/" + user.uid + "/" + fileName);

    storageRef
        .put(file)
        .then(function(snapshot) {

            return snapshot.ref.getDownloadURL();

        })
        .then(function(downloadURL) {

            return firebase.firestore()
                .collection("posts")
                .add({

                    uid: user.uid,

                    email: user.email,

                    text: text,

                    location: location,

                    hashtags: hashtags,

                    mediaURL: downloadURL,

                    mediaType: file.type.startsWith("video/")
                        ? "video"
                        : "image",

                    createdAt:
                        firebase.firestore.FieldValue.serverTimestamp()

                });

        })
        .then(function() {

            alert("Post uploaded successfully! 🎉");

            document.getElementById("postFile").value = "";
            document.getElementById("postText").value = "";
            document.getElementById("location").value = "";
            document.getElementById("hashtags").value = "";

            closePost();

            if (button) {
                button.disabled = false;
                button.innerText = "🚀 Post";
            }

        })
        .catch(function(error) {

            console.error("Post upload error:", error);

            alert(
                "Post upload failed: " +
                error.message
            );

            if (button) {
                button.disabled = false;
                button.innerText = "🚀 Post";
            }

        });

}


/* =========================
   DARK MODE
========================= */

function toggleDarkMode() {

    document.body.classList.toggle("dark");

}


/* =========================
   SEARCH
========================= */

document
    .getElementById("search")
    .addEventListener(
        "input",
        function() {

            console.log(
                "Searching:",
                this.value
            );

        }
    );


/* =========================
   START
========================= */

render();
  </script>
</body>
</html>
