<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Social X</title>

    <link rel="stylesheet" href="./style.css">

    <!-- =========================
         FIREBASE
    ========================== -->

    <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCMXmdrKjGYxclJZeDLiUvlsnyGRQGkr-g",
            authDomain: "socialx-arsh.firebaseapp.com",
            projectId: "socialx-arsh",
            messagingSenderId: "627442305563",
            appId: "1:627442305563:web:5e122694f613570e0746be"
        };

        firebase.initializeApp(firebaseConfig);
    </script>

</head>


<body>

<!-- =====================================================
     TOP BAR
===================================================== -->

<header class="topbar">

    <div class="logo"
         onclick="navigate('home')">
        Social<span>X</span>
    </div>


    <div class="search">

        🔍

        <input
            id="search"
            type="text"
            placeholder="Search Social X...">

    </div>


    <button
        id="darkMode"
        class="topIcon"
        type="button"
        onclick="toggleDarkMode()">

        🌙

    </button>

</header>


<!-- =====================================================
     MAIN LAYOUT
===================================================== -->

<div class="layout">


    <!-- =========================
         LEFT SIDEBAR
    ========================== -->

    <aside class="sidebar">


        <button
            class="menu active"
            type="button"
            data-page="home">

            <span class="menuIcon">🏠</span>
            <span>Home</span>

        </button>


        <button
            class="menu"
            type="button"
            data-page="explore">

            <span class="menuIcon">🔎</span>
            <span>Explore</span>

        </button>


        <button
            class="menu"
            type="button"
            data-page="create">

            <span class="menuIcon">➕</span>
            <span>Create</span>

        </button>


        <button
            class="menu"
            type="button"
            data-page="notifications">

            <span class="menuIcon">🔔</span>
            <span>Notifications</span>

        </button>


        <button
            class="menu"
            type="button"
            data-page="messages">

            <span class="menuIcon">💬</span>
            <span>Messages</span>

        </button>


        <button
            class="menu"
            type="button"
            data-page="profile">

            <span class="menuIcon">👤</span>
            <span>Profile</span>

        </button>


        <button
            class="menu"
            type="button"
            data-page="settings">

            <span class="menuIcon">⚙️</span>
            <span>Settings</span>

        </button>


        <div class="sidebarBottom">

            <button
                class="menu loginMenu"
                type="button"
                data-action="login">

                <span class="menuIcon">🔐</span>
                <span>Login</span>

            </button>

        </div>

    </aside>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main id="content">

        <div class="page">

            <h1>Welcome to Social X 👋</h1>

            <div class="card">

                <div class="bigLogo">
                    X
                </div>

                <h2>
                    Something Big. ✨
                </h2>

                <p>
                    Connect, share and chat on Social X.
                </p>


                <button
                    class="primary"
                    type="button"
                    onclick="openLoginBox()">

                    🔐 Login / Sign Up

                </button>

            </div>

        </div>

    </main>


    <!-- =========================
         RIGHT SIDEBAR
    ========================== -->

    <aside class="right">

        <div class="card emptyRight">

            <div class="bigLogo">
                X
            </div>

            <h2>
                Social X
            </h2>

            <p>
                Something Big. ✨
            </p>

            <p>
                Share your world.
            </p>


            <button
                class="primary full"
                type="button"
                onclick="openLoginBox()">

                🔐 Login / Sign Up

            </button>

        </div>

    </aside>

</div>


<!-- =====================================================
     LOGIN / SIGNUP MODAL
===================================================== -->

<div
    id="loginModal"
    class="modal hidden">

    <div class="modalBox">


        <button
            class="close"
            type="button"
            onclick="closeLogin()">

            ×

        </button>


        <div class="bigLogo">
            X
        </div>


        <h2 id="loginTitle">
            Login
        </h2>


        <p>
            Welcome back to Social X 👋
        </p>


        <!-- USERNAME -->

        <input
            id="username"
            type="text"
            placeholder="👤 Username"
            autocomplete="username">


        <!-- PASSWORD -->

        <input
            id="password"
            type="password"
            placeholder="🔑 Password"
            autocomplete="current-password">


        <!-- LOGIN -->

        <button
            id="loginAction"
            class="primary full"
            type="button"
            onclick="loginUser()">

            Login

        </button>


        <!-- SWITCH -->

        <button
            id="switchAuth"
            class="secondary full"
            type="button"
            onclick="switchToSignup()">

            Create a new account

        </button>


    </div>

</div>


<!-- =====================================================
     CREATE POST MODAL
===================================================== -->

<div
    id="postModal"
    class="modal hidden">

    <div class="modalBox">


        <button
            class="close"
            type="button"
            onclick="closePost()">

            ×

        </button>


        <h2>
            ➕ Create Post
        </h2>


        <p>
            Share something with Social X.
        </p>


        <!-- POST TEXT -->

        <textarea
            id="postText"
            placeholder="What's on your mind?"></textarea>


        <!-- IMAGE -->

        <input
            id="postImage"
            type="file"
            accept="image/*">


        <!-- LOCATION -->

        <input
            id="location"
            type="text"
            placeholder="🌏 Add location">


        <!-- HASHTAGS -->

        <input
            id="hashtags"
            type="text"
            placeholder="# Hashtags">


        <!-- POST -->

        <button
            class="primary full"
            type="button"
            onclick="createPost()">

            🚀 Post

        </button>


    </div>

</div>


<!-- =====================================================
     JAVASCRIPT ERROR DISPLAY
===================================================== -->

<script>

window.onerror = function (
    message,
    source,
    line,
    column
) {

    console.error(
        "Social X Error:",
        message,
        source,
        line,
        column
    );

};

</script>


<!-- =====================================================
     SOCIAL X APP
===================================================== -->

<script src="./app.js"></script>


</body>

</html>
